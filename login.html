<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        ShopEase | Login
    </title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


<header class="navbar">

    <a
        href="index.html"
        class="logo"
    >
        ShopEase
    </a>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="products.html">
            Products
        </a>

        <a href="register.html">
            Register
        </a>

    </nav>

</header>



<main class="form-page">


    <div class="form-card">

        <h1>
            Login
        </h1>


        <p>
            Welcome back!
        </p>



        <form
            onsubmit="
                event.preventDefault();
                loginUser();
            "
        >


            <label>
                Email
            </label>


            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >



            <label>
                Password
            </label>


            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >



            <button
                type="submit"
                class="btn"
            >
                Login
            </button>


        </form>



        <p
            id="message"
            class="message"
        ></p>



        <p>

            Don't have an account?

            <a href="register.html">
                Register
            </a>

        </p>

    </div>

</main>



<script src="js/api.js"></script>

<script src="js/auth.js"></script>


</body>

</html>
